<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #171717; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #171717; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #171717; }
      .box { fill: #DEDEDE; stroke: none; rx: 16; }
      .node { fill: #FFFFFF; stroke: #171717; stroke-width: 2; rx: 12; }
      .arrow { stroke: #171717; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#171717" />
    </marker>
  </defs>

  <rect x="24" y="24" width="1152" height="672" class="box" />
  <text x="48" y="64" class="title">HUZZ System Design — High-Level Architecture</text>

  <!-- Client -->
  <rect x="80" y="140" width="260" height="140" class="node" />
  <text x="110" y="178" class="label">Client</text>
  <text x="110" y="208" class="small">React + Vite + MUI</text>

  <!-- Backend -->
  <rect x="470" y="120" width="260" height="180" class="node" />
  <text x="500" y="158" class="label">Backend API</text>
  <text x="500" y="188" class="small">Node.js + Express</text>
  <text x="500" y="214" class="small">JWT Auth</text>

  <!-- DB -->
  <rect x="860" y="140" width="260" height="140" class="node" />
  <text x="890" y="178" class="label">Database</text>
  <text x="890" y="208" class="small">MySQL</text>

  <!-- Email -->
  <rect x="470" y="360" width="260" height="120" class="node" />
  <text x="500" y="398" class="label">Email</text>
  <text x="500" y="428" class="small">SMTP (Nodemailer)</text>

  <!-- Payments -->
  <rect x="860" y="360" width="260" height="120" class="node" />
  <text x="890" y="398" class="label">Payments</text>
  <text x="890" y="428" class="small">Paystack / Stripe</text>

  <!-- Arrows -->
  <path d="M 340 210 L 470 210" class="arrow" />
  <path d="M 730 210 L 860 210" class="arrow" />
  <path d="M 600 300 L 600 360" class="arrow" />
  <path d="M 730 420 L 860 420" class="arrow" />

  <!-- Legend -->
  <text x="80" y="560" class="label">Core Flows</text>
  <text x="80" y="590" class="small">• Guest Booking: email verification ? booking creation</text>
  <text x="80" y="615" class="small">• Public Registration: attendee + QR email</text>
  <text x="80" y="640" class="small">• Ticket Purchase: payment ? ticket sale + QR</text>
</svg>
